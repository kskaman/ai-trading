[tool.poetry]
name = "trading-system"
version = "1.0.0"
description = "AI-driven algorithmic trading system with ML models, backtesting, and live execution"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "1.26.4"
pandas = "2.2.1"
scipy = "1.13.0"
scikit-learn = "1.4.2"
xgboost = "2.0.3"
lightgbm = "4.3.0"
torch = "2.2.1"
stable-baselines3 = "2.3.2"
gymnasium = "0.29.1"
ta = "0.11.0"
PyPortfolioOpt = "1.5.6"
arch = "7.1.0"
statsmodels = "0.14.2"
duckdb = "1.0.0"
pyarrow = "20.0.0"
yfinance = "0.2.37"
alpaca-py = "0.45.0"
exchange-calendars = "4.13.2"
ccxt = "4.3.36"
openai = "1.30.1"
mlflow = "2.12.1"
prefect = "2.19.4"
pydantic = "2.7.1"
pydantic-settings = "2.3.3"
python-dotenv = "1.0.1"
requests = "2.31.0"
websockets = "12.0"
redis = "5.0.4"
boto3 = "1.34.144"

[tool.poetry.group.dev.dependencies]
pytest = "8.1.1"
pytest-cov = "5.0.0"
mypy = "1.9.0"
flake8 = "7.0.0"
black = "24.3.0"
bandit = "1.7.8"
safety = "3.2.0"
line-profiler = "4.1.2"
memory-profiler = "0.61.0"

[tool.poetry.group.jupyter.dependencies]
jupyterlab = "4.1.5"
ipywidgets = "8.1.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "--cov=src --cov-report=term-missing -v"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py310"]
